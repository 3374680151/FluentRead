<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本·写作 · 流畅阅读 Web</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h10"/><path d="M8 3v2c0 4-2 7-5 9"/><path d="M5.5 9c1 3 3 5 6 6"/><path d="m13 20 4-10 4 10"/><path d="M14.5 16.5h5"/></svg></span>
      <span class="brand-name">流畅阅读<small>FLUENTREAD WEB</small></span>
    </a>
    <nav class="nav" aria-label="主导航">
      <div class="nav-group">翻译</div>
      <a class="nav-item" href="index.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h12"/><path d="M4 18h8"/></svg><span>文本·写作</span></a>
      <a class="nav-item" href="media.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 19 5.5-5.5L14 17l3-3 4 4"/></svg><span>图片·字幕</span></a>
      <div class="nav-group">配置</div>
      <a class="nav-item" href="services.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg><span>翻译服务</span></a>
      <a class="nav-item" href="settings.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 8h9M17.5 8H20M4 16h4M12.5 16H20"/><circle cx="15" cy="8" r="2.2"/><circle cx="10" cy="16" r="2.2"/></svg><span>偏好设置</span></a>
    </nav>
    <div class="sidebar-foot">
      <button class="icon-btn" data-theme-btn aria-pressed="false" aria-label="切换深浅主题">
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="account">
        <span class="avatar" aria-hidden="true">F</span>
        <div><b>本地版</b><span>数据仅存本机浏览器</span></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1>文本·写作</h1>
        <div class="crumb">翻译 / 文本·写作</div>
      </div>
      <div class="spacer"></div>
      <span class="badge" id="api-badge">检测本地服务…</span>
    </header>

    <main class="content">
      <div class="tabs" role="tablist" data-tabs="t" aria-label="文本翻译模式">
        <button class="tab" role="tab" aria-selected="true" data-panel="p-translate">翻译</button>
        <button class="tab" role="tab" aria-selected="false" data-panel="p-write" tabindex="-1">AI 写作</button>
        <button class="tab" role="tab" aria-selected="false" data-panel="p-compare" tabindex="-1">多服务对比</button>
      </div>

      <!-- 翻译 -->
      <section data-tab-panel="t" id="p-translate" role="tabpanel" aria-label="翻译">
        <div class="langbar">
          <label class="tiny" for="src-lang">源语言</label>
          <select class="select" id="src-lang"></select>
          <button class="icon-btn" id="swap" aria-label="交换源语言与目标语言" title="交换源语言与目标语言（Ctrl+Shift+S）"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></button>
          <label class="tiny" for="dst-lang">目标语言</label>
          <select class="select" id="dst-lang"></select>
          <span style="flex:1"></span>
          <label class="tiny" for="service">服务</label>
          <select class="select" id="service" aria-label="翻译服务"></select>
        </div>

        <div class="editor2">
          <div class="pane">
            <div class="pane-h">
              <span class="title">原文</span>
              <span class="tiny" id="src-count">0 / 5000</span>
            </div>
            <div class="pane-b">
              <label class="tiny" for="src-input" style="position:absolute;left:-9999px">输入要翻译的原文</label>
              <textarea id="src-input" spellcheck="false" placeholder="输入要翻译的文本；行末输入 /// 立即用当前服务直译"></textarea>
            </div>
          </div>
          <div class="pane">
            <div class="pane-h">
              <span class="title">译文 <span class="tiny" id="out-service"></span></span>
              <button class="icon-btn" id="speak" aria-label="朗读或停止朗读译文" title="朗读 / 停止（Alt+R）"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
              <button class="icon-btn" id="copy" aria-label="复制译文" title="复制译文"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
            </div>
            <div class="pane-b">
              <div class="trans-out muted" id="out">译文将显示在这里。</div>
            </div>
          </div>
        </div>

        <div class="row" style="margin:14px 0 20px">
          <button class="btn btn-primary btn-lg" id="go">翻译<span class="tiny" style="color:inherit;opacity:.75;font-weight:600">Ctrl+Enter</span></button>
          <button class="btn btn-ghost" id="clear">清空</button>
          <span class="tiny" id="timing" style="margin-left:auto"></span>
        </div>

        <section class="card" style="margin-bottom:16px" aria-labelledby="dict-h">
          <div class="card-h">
            <h2 id="dict-h">词典</h2>
            <span class="badge" id="dict-badge">检查 AI 服务…</span>
          </div>
          <div class="row">
            <input class="input" id="dict-word" placeholder="输入单词或短语，结合原文上下文查询" style="max-width:340px" aria-label="要查询的单词或短语">
            <button class="btn btn-soft" id="dict-go">查询</button>
            <button class="btn btn-ghost" id="dict-from-sel">用原文中选中的词</button>
          </div>
          <div id="dict-result" style="margin-top:12px"></div>
        </section>

        <section class="card" aria-labelledby="his-h">
          <div class="card-h">
            <h2 id="his-h">最近翻译</h2>
            <span class="tiny">仅存本机浏览器 localStorage · 点击行可恢复</span>
            <span style="flex:1"></span>
            <button class="btn btn-ghost btn-sm" id="his-clear">清空历史</button>
          </div>
          <div class="table-wrap">
            <table class="tbl">
              <thead><tr><th style="width:88px">时间</th><th style="width:110px">语言对</th><th>原文 → 译文</th><th style="width:190px">服务</th><th style="width:80px">耗时</th></tr></thead>
              <tbody id="history"></tbody>
            </table>
          </div>
        </section>
      </section>

      <!-- AI 写作 -->
      <section data-tab-panel="t" id="p-write" role="tabpanel" aria-label="AI 写作" hidden>
        <div class="grid" style="grid-template-columns:1fr 1.2fr">
          <section class="card">
            <div class="card-h"><h2>起草草稿</h2><span class="badge badge-primary" id="write-engine">AI 写作</span></div>
            <div class="field">
              <label for="write-intent">想写什么？</label>
              <textarea id="write-intent" class="textarea" placeholder="用中文描述意图，例如：回复导师，本周实验需要重跑，申请把周报截止时间推迟到周四"></textarea>
            </div>
            <div class="field">
              <label>输出语言</label>
              <div class="chips" id="write-lang">
                <button class="chip" data-value="en" aria-pressed="true">English</button>
                <button class="chip" data-value="ja" aria-pressed="false">日本語</button>
                <button class="chip" data-value="zh-Hans" aria-pressed="false">简体中文</button>
              </div>
            </div>
            <div class="field">
              <label>长度</label>
              <div class="chips" id="write-len">
                <button class="chip" data-value="简短" aria-pressed="false">简短</button>
                <button class="chip" data-value="适中" aria-pressed="true">适中</button>
                <button class="chip" data-value="详细" aria-pressed="false">详细</button>
              </div>
            </div>
            <div class="field">
              <label>语气（保存到偏好设置）</label>
              <div class="chips" id="write-tone">
                <button class="chip" data-value="礼貌正式" aria-pressed="false">礼貌正式</button>
                <button class="chip" data-value="直接简洁" aria-pressed="false">直接简洁</button>
                <button class="chip" data-value="轻松随意" aria-pressed="false">轻松随意</button>
              </div>
            </div>
            <div class="field">
              <label for="write-tpl">用途模板</label>
              <select class="select" id="write-tpl" style="width:260px"><option>学术邮件</option><option>GitHub Issue / PR</option><option>商务回复</option><option>自由写作</option></select>
            </div>
            <button class="btn btn-primary" id="write-go">生成草稿</button>
          </section>

          <section class="card">
            <div class="card-h"><h2>草稿</h2><span class="badge" id="write-status"></span>
              <span style="flex:1"></span>
              <button class="btn btn-ghost btn-sm" data-copy="write-out">复制</button>
            </div>
            <div id="write-out" class="muted" style="white-space:pre-wrap;min-height:180px">草稿将显示在这里。生成需要已配置 AI 服务（翻译服务页）。</div>
            <div class="callout" style="margin-top:10px">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg>
              <span>草稿不直接发送；复制后粘贴到你的邮箱或编辑器。</span>
            </div>
          </section>
        </div>
      </section>

      <!-- 多服务对比 -->
      <section data-tab-panel="t" id="p-compare" role="tabpanel" aria-label="多服务对比" hidden>
        <div class="langbar">
          <span class="small muted">同一段文本真实并发请求勾选的免费服务，横向对比译文与耗时。</span>
          <span style="flex:1"></span>
          <button class="btn btn-primary btn-sm" id="cmp-go">开始对比</button>
        </div>
        <div class="field">
          <label for="cmp-src">对比文本</label>
          <textarea id="cmp-src" class="textarea" style="min-height:80px" placeholder="输入要对比翻译的文本"></textarea>
        </div>
        <div class="field">
          <label>参与对比的服务（勾选保存到偏好）</label>
          <div class="chips" id="cmp-services"></div>
        </div>
        <div class="grid grid-3" id="cmp-results"></div>
      </section>
    </main>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/index.js"></script>
<script src="assets/widget.js"></script>
</body>
</html>
