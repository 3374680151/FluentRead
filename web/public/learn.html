<script src="assets/app.js"></script>
<script type="module">
import {
  vocabularyBook,
  buildAnkiTsv,
  vocabularyReviewCloze,
  createVocabularyReviewSession,
  advanceVocabularyReviewSession,
} from "./assets/vendor/fr-vocabulary.js";

/* 学习中心真实逻辑：单词本（筛选/搜索/分页/编辑/删除撤销）、复习（到期队列 + 翻卡两键评分）、
   导入导出（JSON 与扩展互通 / Anki TSV）。数据全部来自本机 IndexedDB 词书仓库。 */

var PAGE_SIZE = 50;
var ui = {
  kind: "all",
  status: "",
  order: "recent",
  search: "",
  page: 0,
};
var allEntries = [];
var editingEntry = null;
var reviewSession = null;

var STATUS_LABELS = { new: "新词", learning: "学习中", familiar: "已熟悉", mastered: "已掌握" };
var STATUS_BADGES = { new: "badge", learning: "badge badge-accent", familiar: "badge badge-warn", mastered: "badge badge-ok" };
var KIND_LABELS = { expression: "表达", sentence: "句子" };

function frEscape(v) {
  return String(v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function speak(text) {
  if (!("speechSynthesis" in window)) { window.frToast("当前浏览器不支持朗读", true); return; }
  speechSynthesis.cancel();
  var utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  speechSynthesis.speak(utterance);
}

function translationOf(entry) {
  var values = Object.values(entry.translations || {});
  if (!values.length) return "";
  var zh = entry.translations["zh-Hans"];
  return (zh || values[0]).text;
}

function sourceOf(entry) {
  var context = (entry.contexts || [])[0];
  if (!context) return "—";
  return context.pageTitle || context.sourceUrl || "手动输入";
}

/* 带"撤销"按钮的 toast（删除词条后 10 秒内可恢复） */
function toastAction(message, actionLabel, handler) {
  if (!window.frToast) return;
  var zone = document.querySelector(".toast-zone") || document.body.appendChild(Object.assign(document.createElement("div"), { className: "toast-zone" }));
  var toast = document.createElement("div");
  toast.className = "toast";
  toast.style.gap = "12px";
  var text = document.createElement("span");
  text.textContent = message;
  var action = document.createElement("button");
  action.type = "button";
  action.textContent = actionLabel;
  action.style.cssText = "border:none;background:none;color:var(--primary);font:inherit;font-weight:800;cursor:pointer";
  action.addEventListener("click", function () { handler(); toast.remove(); });
  toast.appendChild(text);
  toast.appendChild(action);
  zone.appendChild(toast);
  setTimeout(function () { toast.remove(); }, 10000);
}

/* ---------- 单词本列表 ---------- */
async function refreshAll() {
  allEntries = await vocabularyBook.list({ order: "recent" });
  renderStats();
  renderVocab();
}

function renderStats() {
  var now = Date.now();
  var due = 0, mastered = 0, today = 0;
  var dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
  allEntries.forEach(function (entry) {
    if (entry.nextReviewAt !== null && entry.nextReviewAt <= now) due += 1;
    if (entry.status === "mastered") mastered += 1;
    if (entry.createdAt >= dayStart.getTime()) today += 1;
  });
  document.getElementById("stat-total").textContent = String(allEntries.length);
  document.getElementById("stat-due").textContent = String(due);
  document.getElementById("stat-mastered").textContent = String(mastered);
  document.getElementById("stat-today").textContent = String(today);
}

function filteredEntries() {
  var search = ui.search.trim().toLowerCase();
  return allEntries.filter(function (entry) {
    if (ui.kind === "word" && entry.kind) return false;
    if (ui.kind === "expression" && entry.kind !== "expression") return false;
    if (ui.kind === "sentence" && entry.kind !== "sentence") return false;
    if (ui.status && entry.status !== ui.status) return false;
    if (search) {
      var haystack = (entry.term + " " + translationOf(entry)).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  }).sort(function (left, right) {
    if (ui.order === "term") return left.term.localeCompare(right.term);
    if (ui.order === "due") {
      if (left.nextReviewAt === null) return 1;
      if (right.nextReviewAt === null) return -1;
      return left.nextReviewAt - right.nextReviewAt;
    }
    return right.lastSeenAt - left.lastSeenAt;
  });
}

function renderVocab() {
  var entries = filteredEntries();
  var pages = Math.max(1, Math.ceil(entries.length / PAGE_SIZE));
  if (ui.page >= pages) ui.page = pages - 1;
  var slice = entries.slice(ui.page * PAGE_SIZE, (ui.page + 1) * PAGE_SIZE);
  var body = document.getElementById("vocab-body");
  if (!slice.length) {
    body.innerHTML = '<tr><td colspan="5"><div class="empty" style="padding:28px"><p class="small" style="margin:0">暂无收藏。去<a href="study.html">学习工作台</a>输入句子、点词收藏，或在浏览器扩展中收藏后导入。</p></div></td></tr>';
  } else {
    body.innerHTML = slice.map(function (entry) {
      var translation = frEscape(translationOf(entry));
      var kindBadge = entry.kind ? '<span class="badge">' + KIND_LABELS[entry.kind] + "</span> " : "";
      var masteryPercent = Math.round((entry.masteryLevel / 5) * 100);
      var actions =
        '<button class="icon-btn" data-act="speak" data-id="' + entry.id + '" aria-label="朗读 ' + frEscape(entry.term) + '" title="朗读">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>' +
        '<button class="icon-btn" data-act="note" data-id="' + entry.id + '" aria-label="编辑解释" title="编辑解释">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>' +
        (entry.status === "mastered"
          ? '<button class="icon-btn" data-act="relearn" data-id="' + entry.id + '" aria-label="重新学习" title="重新学习"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>'
          : '<button class="icon-btn" data-act="master" data-id="' + entry.id + '" aria-label="标记掌握" title="标记掌握">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></button>') +
        '<button class="icon-btn" data-act="remove" data-id="' + entry.id + '" aria-label="删除" title="删除">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>';
      return "<tr>" +
        "<td><b>" + frEscape(entry.term) + "</b>" + (entry.phonetic ? '<div class="tiny mono">' + frEscape(entry.phonetic) + "</div>" : "") + "</td>" +
        '<td class="small">' + kindBadge + translation + (entry.note ? '<div class="tiny">备注：' + frEscape(entry.note) + "</div>" : "") + "</td>" +
        '<td class="small muted">' + frEscape(sourceOf(entry)) + "</td>" +
        '<td><span class="' + (STATUS_BADGES[entry.status] || "badge") + '">' + (STATUS_LABELS[entry.status] || entry.status) + "</span>" +
          '<div class="progress" style="margin-top:6px"><i style="width:' + masteryPercent + '%"></i></div></td>' +
        '<td><div class="row" style="gap:2px;flex-wrap:nowrap">' + actions + "</div></td>" +
        "</tr>";
    }).join("");
  }
  document.getElementById("vocab-pageinfo").textContent = "共 " + entries.length + " 条 · 第 " + (ui.page + 1) + " / " + pages + " 页";
  document.getElementById("vocab-prev").disabled = ui.page === 0;
  document.getElementById("vocab-next").disabled = ui.page >= pages - 1;
}

document.getElementById("vocab-body").addEventListener("click", async function (event) {
  var button = event.target.closest("[data-act]");
  if (!button) return;
  var entry = allEntries.find(function (item) { return item.id === button.dataset.id; });
  if (!entry) return;
  try {
    if (button.dataset.act === "speak") {
      speak(entry.term);
    } else if (button.dataset.act === "note") {
      openNoteDialog(entry);
    } else if (button.dataset.act === "master") {
      await vocabularyBook.setMastery(entry.id);
      window.frToast("已标记掌握：" + entry.term);
      await refreshAll();
    } else if (button.dataset.act === "relearn") {
      await vocabularyBook.relearn(entry.id);
      window.frToast("已加入重新学习：" + entry.term);
      await refreshAll();
    } else if (button.dataset.act === "remove") {
      if (!window.confirm("删除「" + entry.term + "」？删除后 10 秒内可撤销。")) return;
      var snapshot = await vocabularyBook.removeWithSnapshot(entry.id);
      await refreshAll();
      if (snapshot) {
        toastAction("已删除：" + entry.term, "撤销", async function () {
          try {
            await vocabularyBook.importData({
              format: "fluentread-vocabulary-book",
              version: 1,
              exportedAt: Date.now(),
              includesPrivateContext: true,
              entries: [snapshot.entry],
              reviewLogs: snapshot.reviewLogs,
            });
            window.frToast("已撤销删除：" + snapshot.entry.term);
            await refreshAll();
          } catch (error) {
            window.frToast("撤销失败：" + error.message, true);
          }
        });
      }
    }
  } catch (error) {
    window.frToast("操作失败：" + error.message, true);
  }
});

/* ---------- 编辑解释 ---------- */
function openNoteDialog(entry) {
  editingEntry = entry;
  document.getElementById("note-dialog-term").textContent = entry.term;
  document.getElementById("note-input").value = entry.note || "";
  document.getElementById("note-dialog").classList.add("open");
  document.getElementById("note-input").focus();
}
document.getElementById("note-save").addEventListener("click", async function () {
  if (!editingEntry) return;
  try {
    await vocabularyBook.updateNote(editingEntry.id, document.getElementById("note-input").value);
    window.frToast("解释已保存");
  } catch (error) {
    window.frToast("保存失败：" + error.message, true);
  }
  editingEntry = null;
  document.getElementById("note-dialog").classList.remove("open");
  await refreshAll();
});
document.querySelector("[data-close-note]").addEventListener("click", function () {
  editingEntry = null;
  document.getElementById("note-dialog").classList.remove("open");
});
document.addEventListener("keydown", function (event) {
  if (event.key === "Escape" && document.getElementById("note-dialog").classList.contains("open")) {
    editingEntry = null;
    document.getElementById("note-dialog").classList.remove("open");
  }
});

/* ---------- 筛选与分页 ---------- */
document.querySelectorAll("[data-kind]").forEach(function (chip) {
  chip.addEventListener("click", function () {
    document.querySelectorAll("[data-kind]").forEach(function (item) { item.setAttribute("aria-pressed", String(item === chip)); });
    ui.kind = chip.dataset.kind;
    ui.page = 0;
    renderVocab();
  });
});
document.getElementById("vocab-status").addEventListener("change", function (event) { ui.status = event.target.value; ui.page = 0; renderVocab(); });
document.getElementById("vocab-order").addEventListener("change", function (event) { ui.order = event.target.value; renderVocab(); });
document.getElementById("vocab-search").addEventListener("input", function (event) { ui.search = event.target.value; ui.page = 0; renderVocab(); });
document.getElementById("vocab-prev").addEventListener("click", function () { ui.page = Math.max(0, ui.page - 1); renderVocab(); });
document.getElementById("vocab-next").addEventListener("click", function () { ui.page += 1; renderVocab(); });

/* ---------- 导入导出 ---------- */
function download(name, content, mime) {
  var blob = new Blob([content], { type: mime });
  var link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = name;
  link.click();
  URL.revokeObjectURL(link.href);
}

document.getElementById("btn-export-json").addEventListener("click", async function () {
  try {
    var data = await vocabularyBook.exportData({ includePrivateContext: false });
    download("fluentread-vocabulary-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(data, null, 2), "application/json");
    window.frToast("已导出 JSON（" + data.entries.length + " 条，不含隐私语境）");
  } catch (error) {
    window.frToast("导出失败：" + error.message, true);
  }
});

document.getElementById("btn-export-anki").addEventListener("click", async function () {
  try {
    var entries = await vocabularyBook.list({ order: "term" });
    if (!entries.length) { window.frToast("词书为空", true); return; }
    var rows = entries.map(function (entry) {
      return [entry.term, entry.phonetic, entry.partOfSpeech, translationOf(entry)];
    });
    download("fluentread-vocabulary-anki.tsv", buildAnkiTsv(["term", "phonetic", "partOfSpeech", "translation"], rows), "text/tab-separated-values;charset=utf-8");
    window.frToast("已导出 Anki TSV（" + rows.length + " 条）");
  } catch (error) {
    window.frToast("导出失败：" + error.message, true);
  }
});

document.getElementById("btn-import").addEventListener("click", function () { document.getElementById("import-file").click(); });
document.getElementById("import-file").addEventListener("change", async function (event) {
  var file = event.target.files && event.target.files[0];
  event.target.value = "";
  if (!file) return;
  try {
    var text = await file.text();
    var data = JSON.parse(text);
    if (!window.confirm("导入 " + ((data.entries && data.entries.length) || "?") + " 条收藏到当前词书？（相同词条将合并）")) return;
    var result = await vocabularyBook.importData(data);
    window.frToast("导入完成：新增 " + result.inserted + "，合并 " + result.updated + "，跳过 " + result.skipped);
    await refreshAll();
  } catch (error) {
    window.frToast("导入失败：" + error.message, true);
  }
});

document.getElementById("btn-clear").addEventListener("click", async function () {
  if (!window.confirm("确定清空整个词书？该操作不可恢复，建议先导出 JSON 备份。")) return;
  if (!window.confirm("再次确认：真的要清空全部收藏吗？")) return;
  try {
    await vocabularyBook.clear();
    window.frToast("词书已清空");
    await refreshAll();
  } catch (error) {
    window.frToast("清空失败：" + error.message, true);
  }
});

/* ---------- 复习 ---------- */
async function loadReviewQueue() {
  var now = Date.now();
  var due = await vocabularyBook.list({ dueOnly: true, order: "due", now: now });
  var queue = due.slice(0, 20);
  if (queue.length < 20) {
    var fresh = await vocabularyBook.list({ status: "new", order: "recent" });
    // 新词可能与到期队列重复（新词条通常立即到期），按 id 去重后再补位
    var known = new Set(queue.map(function (entry) { return entry.id; }));
    var extra = fresh.filter(function (entry) { return !known.has(entry.id); });
    queue = queue.concat(extra.slice(0, Math.min(10, 20 - queue.length)));
  }
  reviewSession = createVocabularyReviewSession(queue);
  renderReview();
}

async function refreshReview() {
  if (!reviewSession) { await loadReviewQueue(); return; }
  var latest = await vocabularyBook.list({ order: "recent" });
  allEntries = latest;
  renderStats();
  // 队列对账：其他位置已删除/已复习的卡片自动移出
  var now = Date.now();
  reviewSession.queue = reviewSession.queue.filter(function (entry) {
    var current = latest.find(function (item) { return item.id === entry.id; });
    return current && current.nextReviewAt !== null && current.nextReviewAt <= now;
  }).map(function (entry) {
    return latest.find(function (item) { return item.id === entry.id; });
  });
  renderReview();
}

function renderReview() {
  var area = document.getElementById("review-area");
  var progress = reviewSession ? reviewSession.queue.length : 0;
  var total = progress + (reviewSession ? reviewSession.completed : 0);
  document.getElementById("review-progress-text").textContent = reviewSession ? (reviewSession.completed + " / " + total) : "–";
  document.getElementById("review-progress-bar").style.width = total ? Math.round(((reviewSession.completed) / total) * 100) + "%" : "0%";
  if (!reviewSession || !reviewSession.queue.length) {
    area.innerHTML = '<div class="empty"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg><p class="small" style="margin:8px 0 0">今日队列已完成或没有待复习的词条。收藏新词后记得回来复习。</p></div>';
    return;
  }
  var entry = reviewSession.queue[0];
  var translation = frEscape(translationOf(entry));
  var cloze = frEscape(vocabularyReviewCloze(entry) || "");
  area.innerHTML =
    '<div class="flash" id="review-card" role="button" tabindex="0" aria-label="复习卡片，点击翻面">' +
      '<div class="inner"><div class="face"><div>' +
        '<div style="font-size:34px;font-weight:800">' + frEscape(entry.term) + "</div>" +
        (entry.phonetic ? '<div class="tiny mono" style="margin-top:6px">' + frEscape(entry.phonetic) + (entry.partOfSpeech ? " · " + frEscape(entry.partOfSpeech) : "") + "</div>" : "") +
        '<p class="tiny" style="margin-top:14px">点击卡片翻面</p>' +
      "</div></div>" +
      '<div class="face back"><div>' +
        '<div style="font-size:22px;font-weight:800">' + translation + "</div>" +
        (cloze ? '<p class="small muted" style="margin-top:12px">' + cloze + "</p>" : "") +
        '<button type="button" class="icon-btn" id="review-speak" aria-label="朗读" title="朗读" style="margin-top:8px">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>' +
      "</div></div></div></div>" +
    '<div class="row" style="margin-top:18px;justify-content:center">' +
      '<button class="btn btn-outline" id="review-again" style="border-color:var(--danger);color:var(--danger)">忘了（10 分钟后再考）</button>' +
      '<button class="btn btn-primary" id="review-good">记得（1/3/7/14/30 天）</button>' +
    "</div>";

  var card = document.getElementById("review-card");
  function flip() { card.classList.toggle("flip"); }
  card.addEventListener("click", flip);
  card.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); flip(); }
  });
  var speakButton = document.getElementById("review-speak");
  if (speakButton) speakButton.addEventListener("click", function (event) { event.stopPropagation(); speak(entry.term); });

  document.getElementById("review-again").addEventListener("click", function () { submitReview("again"); });
  document.getElementById("review-good").addEventListener("click", function () { submitReview("good"); });
}

async function submitReview(rating) {
  if (!reviewSession || !reviewSession.queue.length) return;
  var entry = reviewSession.queue[0];
  try {
    await vocabularyBook.review(entry.id, rating);
  } catch (error) {
    window.frToast("复习提交失败：" + error.message, true);
  }
  reviewSession = advanceVocabularyReviewSession(reviewSession, entry.id);
  await refreshReview();
}

document.getElementById("review-reload").addEventListener("click", async function () {
  await loadReviewQueue();
  await refreshAll();
  window.frToast("复习队列已刷新");
});

/* ---------- 启动 ---------- */
refreshAll().catch(function (error) {
  document.getElementById("vocab-body").innerHTML = '<tr><td colspan="5" class="tiny" style="color:var(--danger)">词书加载失败：' + frEscape(error.message) + "</td></tr>";
});
loadReviewQueue().catch(function () { /* 复习区显示空态即可 */ });
</script>
